name: Standard Linux full Python suite benchmark
on:
  push:
    branches:
      - feature/workflow-engine-v1-research
    paths:
      - .github/workflows/python-standard-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-standard-benchmark:
    name: Python full suite standard runner (slice ${{ matrix.slice }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Report resource limits
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU cores: $(nproc)"
          free -h
          df -h .
          python3 - <<'PY'
          from pathlib import Path
          for path in ("/sys/fs/cgroup/memory.max", "/sys/fs/cgroup/cpu.max"):
              p = Path(path)
              if p.exists(): print(path, p.read_text().strip())
          PY
      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Check SQLite WAL availability
        shell: bash
        run: |
          "$HERMES_PYTHON" -c "import sqlite3,sys,hermes_state_wal as w; v=w.is_sqlite_wal_reset_vulnerable(); print('SQLite',sqlite3.sqlite_version,'WAL vulnerable',v); sys.exit(1 if v else 0)"
      - name: Run canonical complete Python suite with bounded workers
        shell: bash
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/2
          HERMES_TEST_WORKERS: "2"
          HERMES_TEST_FILE_TIMEOUT: "600"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark-resources.txt scripts/run_tests.sh
      - name: Report benchmark metrics
        if: always()
        shell: bash
        run: |
          if [ -f benchmark-resources.txt ]; then cat benchmark-resources.txt; else echo "No runtime metrics: suite did not reach timed execution"; fi
          free -h
          df -h .
