name: Android Hybrid APK verification
on:
  push:
    branches:
      - develop/android-hybrid-client-v1
    paths:
      - 'android-hybrid/**'
      - '.github/workflows/android-hybrid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, lint and unit test
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify debug APK signature and manifest
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-manifest.txt
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-hybrid-debug-apk
          path: |
            android-hybrid/app/build/outputs/apk/debug/app-debug.apk
            android-hybrid/apk-signature.txt
            android-hybrid/apk-manifest.txt
            android-hybrid/apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
